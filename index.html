<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>速捷惠享</title>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("url");

    function parseHttpUrl(value) {
      try {
        const parsed = new URL(value);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    const destination = target ? parseHttpUrl(target) : null;
    const ua = navigator.userAgent.toLowerCase();
    const inApp = ua.includes("micromessenger") || /\bqq\//.test(ua);
    if (destination && !inApp) location.replace(destination);
  </script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #1e3a5f, #07111f 58%); color: #eef6ff; }
    main { width: min(620px, 100%); padding: 34px; border: 1px solid #ffffff24; border-radius: 22px; background: #0b1728e8; box-shadow: 0 24px 70px #0008; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 44px); }
    p { color: #aac0d8; line-height: 1.7; }
    label { display: block; margin: 24px 0 8px; font-weight: 700; }
    input { width: 100%; padding: 15px 16px; border: 1px solid #38526f; border-radius: 12px; background: #07111f; color: inherit; font-size: 16px; outline: none; }
    input:focus { border-color: #53a8ff; box-shadow: 0 0 0 3px #53a8ff2b; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button, a.button { padding: 13px 18px; border: 0; border-radius: 11px; background: #2388ff; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button.secondary { background: #24374c; }
    #result { margin-top: 18px; padding: 14px; border-radius: 12px; background: #07111f; overflow-wrap: anywhere; }
    #result:empty { display: none; }
    .notice { text-align: center; }
    .notice strong { color: #67b3ff; }
    .wechat-guide { position: fixed; inset: 0; z-index: 10; padding: 96px 26px 32px; background: #000d; text-align: left; }
    .guide-brand { position: absolute; top: 24px; left: 20px; font-size: 20px; font-weight: 800; }
    .wechat-guide svg { position: absolute; top: 14px; right: 14px; width: 150px; height: 125px; }
    .wechat-guide h1 { margin-top: 80px; text-align: center; }
    .wechat-guide p { max-width: 330px; margin: 20px auto; color: white; font-size: 19px; }
    .step { display: inline-grid; place-items: center; width: 30px; height: 30px; margin-right: 10px; border-radius: 50%; background: #ff5a1f; font-weight: 800; }
    .wechat-guide button { display: block; width: min(330px, 100%); margin: 28px auto 0; }
  </style>
</head>
<body>
  <main id="app">
    <h1>速捷惠享</h1>
    <p>输入完整网址，生成一个可分享的中转链接。</p>
    <label for="target">目标网址</label>
    <input id="target" type="url" inputmode="url" placeholder="https://example.com" autocomplete="url">
    <div class="actions">
      <button id="generate" type="button">生成链接</button>
      <button id="copy" class="secondary" type="button" hidden>复制链接</button>
    </div>
    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const app = document.querySelector("#app");

    async function copyText(value) {
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(value);
          return;
        } catch {}
      }
      const area = document.createElement("textarea");
      area.value = value;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    if (target) {
      if (!destination) {
        app.innerHTML = '<div class="notice"><h1>链接无效</h1><p>请检查跳转地址是否以 http:// 或 https:// 开头。</p></div>';
      } else if (inApp) {
        app.innerHTML = `<div class="wechat-guide" role="dialog" aria-labelledby="guideTitle"><div class="guide-brand">速捷惠享</div><svg viewBox="0 0 150 125" aria-hidden="true"><path d="M22 112 C75 105 100 74 112 30" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M91 40 L115 24 L126 51" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 id="guideTitle">请在浏览器打开</h1><p><span class="step">1</span>点击右上角的 <strong>•••</strong> 菜单</p><p><span class="step">2</span>选择 <strong>在浏览器中打开</strong></p><button id="copyTarget" type="button">复制目标地址</button></div>`;
        document.querySelector("#copyTarget").addEventListener("click", async event => {
          await copyText(destination);
          event.target.textContent = "已复制";
        });
      } else {
        location.replace(destination);
      }
    } else {
      const input = document.querySelector("#target");
      const result = document.querySelector("#result");
      const copy = document.querySelector("#copy");
      let generated = "";

      document.querySelector("#generate").addEventListener("click", () => {
        const destination = parseHttpUrl(input.value.trim());
        if (!destination) {
          result.textContent = "请输入以 http:// 或 https:// 开头的完整网址。";
          copy.hidden = true;
          return;
        }
        generated = `${location.origin}${location.pathname}?url=${encodeURIComponent(destination)}`;
        result.innerHTML = `<a href="${generated}" target="_blank" rel="noopener noreferrer">${generated}</a>`;
        copy.hidden = false;
      });

      copy.addEventListener("click", async () => {
        await copyText(generated);
        copy.textContent = "已复制";
      });
    }
  </script>
</body>
</html>
